[package]
name = "war2injection"
edition = "2021"
publish = false
version = "0.0.0"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
chrono = "0.4.38"
derive_more = { version = "1.0.0", features = ["full"] }
eyre = "0.6.12"
fragile = "2.0.0"
hex = "0.4.3"
iced-x86 = { version = "1.21.0", features = ["code_asm"] }
paste = "1.0.15"
serde = "1.0.215"
serde_json = "1.0.133"

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
]
