[package]
name = "slop-wasi-demo"
version.workspace = true
publish.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "slop-wasi-demo"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true

# Using single-threaded tokio for async I/O (stdin/stdout)
# WASI only supports: sync, macros, io-util, rt, time
tokio = { version = "1.0", default-features = false, features = [
    "io-util",
    "rt",
    "macros",
] }
