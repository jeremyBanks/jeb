[package]
name = "jeb"
publish = true
description = "experimenting with machine- and human-sympathetic encoding"
keywords = ["encoding"]
categories = ["encoding"]
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
name = "jeb"
path = "src/lib.rs"

[[bin]]
name = "jeb"
path = "src/bin/jeb.rs"

[features]
default = ["bin", "fs", "stdio"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "jeb-value/wasm", "jeb-stream/wasm", "jeb-common/wasm"]
bin = [
    "fs",
    "stdio",
    "dep:color-eyre",
    "dep:dotenv",
    "dep:owo-colors",
    "tracing-subscriber/env-filter",
]

fs = ["tokio/fs", "jeb-stream/fs"]
stdio = ["tokio/io-std", "jeb-stream/stdio"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.signing]
algorithm = "minisign"

[dependencies]
color-eyre = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["full"] }
document-features = { workspace = true }
dotenv = { workspace = true, optional = true }
futures = { workspace = true }
getset = { workspace = true }
ignorable = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
js-sys = { workspace = true, optional = true }
owo-colors = { workspace = true, optional = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tap = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-util"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["codec", "io"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

jeb-common = { workspace = true }
jeb-stream = { workspace = true, features = ["json", "serde"] }
jeb-value = { workspace = true, features = ["serde", "serde_json"] }
