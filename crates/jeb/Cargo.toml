[package]
name = "jeb"
publish = true
description = "experimenting with machine- and human-sympathetic encoding"
keywords = ["encoding"]
categories = ["encoding"]
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
name = "jeb"
path = "src/lib.rs"

[[bin]]
name = "jeb"
path = "src/bin/jeb.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.signing]
algorithm = "minisign"

[dependencies]
color-eyre = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["full"] }
document-features = { workspace = true }
dotenv = { workspace = true, optional = true }
futures = { workspace = true }
getset = { workspace = true }
ignorable = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
js-sys = { workspace = true, optional = true }
owo-colors = { workspace = true, optional = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tap = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-util"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["codec", "io"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
jeb-common = { workspace = true }
jeb-stream = { workspace = true, features = ["json", "serde"] }
jeb-value = { workspace = true, features = ["serde", "serde_json"] }

[features]
default = ["bin", "fs", "stdio"]
bin = ["fs", "stdio", "tracing-subscriber/env-filter", "dep:color-eyre", "dep:dotenv", "dep:owo-colors"]
color_eyre = ["dep:color-eyre"]
dotenv = ["dep:dotenv"]
fs = ["jeb-stream/fs", "tokio/fs"]
js_sys = ["dep:js-sys"]
owo_colors = ["dep:owo-colors"]
stdio = ["jeb-stream/stdio", "tokio/io-std"]
tracing_subscriber = ["dep:tracing-subscriber"]
wasm = ["jeb-common/wasm", "jeb-stream/wasm", "jeb-value/wasm", "dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
wasm_bindgen = ["dep:wasm-bindgen"]
web_sys = ["dep:web-sys"]
