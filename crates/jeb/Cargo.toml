[package]
name = "jeb"
publish = true
description = "experimenting with machine- and human-sympathetic encoding"
keywords = ["encoding"]
categories = ["encoding"]
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
name = "jeb"
path = "src/lib.rs"

[[bin]]
name = "jeb"
path = "src/bin/jeb.rs"

[features]
default = ["fs", "stdio"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]
fs = ["tokio/fs"]
stdio = ["tokio/io-std"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWRwL9Hegca29jrzxLKxEQEVycSIZk/GHkEVeSR8eUhmFok3NjK3xN1M"

[dependencies]
derive_more = { version = "2.0.1", features = ["full"] }
dotenv = "0.15.0"
futures = "0.3"
getset = "0.1.6"
indexmap = { version = "2.0", features = ["serde"] }
js-sys = { version = "0.3.82", optional = true }
owo-colors = "4.2.3"
regex = "1.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tap = "1.0.1"
tokio = { version = "1.0", features = ["rt", "macros", "sync", "io-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7.17", features = ["codec", "io"] }
wasm-bindgen = { version = "0.2.105", optional = true }
web-sys = { version = "0.3.82", optional = true }
