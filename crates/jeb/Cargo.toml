[package]
name = "jeb"
publish = true
repository = "https://github.com/jeremyBanks/jeb"
description = "experimenting with machine- and human-sympathetic encoding"
keywords = ["encoding"]
categories = ["encoding"]
readme.workspace = true
version.workspace = true
license.workspace = true
edition.workspace = true
exclude.workspace = true

[dependencies]
derive_more = { version = "2.0.1", features = ["full"] }
dotenv = "0.15.0"
indexmap = "2.0"
owo-colors = "4.2.3"
serde.workspace = true
serde_json.workspace = true
tap = "1.0.1"
tokio = { version = "1.0", features = ["rt", "macros"] }

[lib]

[[bin]]
name = "jeb"
path = "src/bin/jeb.rs"
