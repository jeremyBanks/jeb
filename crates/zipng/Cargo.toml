[package]
authors = ["Jeremy Banks <_@jeremy.ca>"]
description = "Polyglot encoder for ZIP-and/or-PNG files."
edition = "2024"
license = "MIT OR Apache-2.0"
name = "zipng"
repository = "https://github.com/jeremyBanks/zipng"
version = "0.0.0-dev.20260202"

[[bin]]
name = "zipng"
path = "src/main.rs"

[[bin]]
name = "unzipng"
path = "src/bin/unzipng.rs"

[dependencies]
bitvec = "1.0.1"
blake3 = { version = "1.3.2" }
brotli = { version = "3.3.4", optional = true }
bstr = "1.0.1"
bytemuck = { version = "1.12.3", features = ["extern_crate_alloc", "min_const_generics"] }
crc = "3.0.0"
derive_more = { version = "0.99.17"   }
expect-test = "1.4.0"
flate2 = { version = "1.0.24", default-features = false, features = ["rust_backend"] }
image = { version = "0.25.9", default-features = false, features = ["png"], optional = true }
indexmap = "2"
kstring = { version = "2.0.0", features = ["arc", "max_inline", "serde"] }
oklab = "1.0.0"
once_cell = "1.16.0"
png = "0.18"
rgb = "0.8.34"
serde = { version = "1.0.147", features = ["derive"] }
serde_bytes = "0.11.7"
serde_json = "1.0"
simd-adler32 = "0.3.4"
static_assertions = "1.1.0"
tracing = "0.1.37"
twox-hash = { version = "1.6.3" }
ureq = { version = "2", optional = true }
walkdir = { version = "2.3.2", optional = true }
zip = { version = "0.6.3", default-features = false, features = ["deflate"], optional = true }

[features]
default = ["std-io", "image", "brotli", "zip"]
std-io = ["ureq", "walkdir"]

dev-dependencies = [
    "blake3/default",
    "derive_more/default",
    "flate2/default",
    "serde/derive",
    "twox-hash/default",
    "zip/default",
]

EDITOR = []

[dev-dependencies]
ureq = "2"
zipng = { path = ".", default-features = false, features = ["dev-dependencies"] }
