[package]
authors = ["Jeremy Banks <_@jeremy.ca>"]
description = "Polyglot encoder for ZIP-and/or-PNG files."
edition = "2024"
license = "MIT OR Apache-2.0"
name = "zipng"
repository = "https://github.com/jeremyBanks/zipng"
version = "0.0.0-dev.20260202"

[[bin]]
name = "zipng"
path = "src/main.rs"

[[bin]]
name = "unzipng"
path = "src/bin/unzipng.rs"

[dependencies]
bitvec = "1.0.1"
blake3 = { version = "1.3.2" }
brotli = { version = "3.3.4"   }
bstr = "1.0.1"
bytemuck = { version = "1.12.3", features = ["extern_crate_alloc", "min_const_generics"] }
color-eyre = { version = "0.6.2", optional = true }
crc = "3.0.0"
derive_more = { version = "0.99.17"   }
expect-test = "1.4.0"
flate2 = { version = "1.0.24"   }
image = { version = "0.25.9", features = ["png", "gif", "bmp"] }
indexmap = "2"
inherent = "1.0.2"
itertools = "0.10.5"
kstring = { version = "2.0.0", features = ["arc", "max_inline", "serde"] }
oklab = "1.0.0"
once_cell = "1.16.0"
paste = "1.0.9"
png = "0.18"
rgb = "0.8.34"
serde = { version = "1.0.147", features = ["derive"] }
serde_bytes = "0.11.7"
serde_json = "1.0"
simd-adler32 = "0.3.4"
smallvec = { version = "1.10.0", features = ["const_new", "const_generics"] }
static_assertions = "1.1.0"
tracing = "0.1.37"
tracing-error = { version = "0.2.0"  }
tracing-subscriber = { version = "0.3.16", optional = true }
twox-hash = { version = "1.6.3" }
ureq = { version = "2", optional = true }
walkdir = { version = "2.3.2", optional = true }
zip = { version = "0.6.3"   }

[features]
default = ["flate2/default", "std-io"]
std-io = ["ureq", "walkdir", "color-eyre", "tracing-subscriber"]

dev-dependencies = [
    "blake3/default",
    "color-eyre/default",
    "derive_more/default",
    "flate2/default",
    "serde/derive",
    "tracing-error/default",
    "tracing-subscriber/default",
    "tracing-subscriber/env-filter",
    "twox-hash/default",
    "zip/default",
]

EDITOR = []

[dev-dependencies]
ureq = "2"
zipng = { path = ".", default-features = false, features = ["dev-dependencies"] }
