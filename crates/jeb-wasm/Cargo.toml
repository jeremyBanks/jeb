[package]
name = "jeb-wasm"
publish = false
description = "jeb as a WASM cdylib"
keywords = []
categories = []
repository.workspace = true
version.workspace = true
license.workspace = true
edition.workspace = true
include.workspace = true

[lib]
name = "jeb"
crate-type = ["cdylib"]
doc = false

[features]
wasm = []

[dependencies]
jeb = { path = "../jeb", default-features = false, features = ["wasm"] }
js-sys = { version = "0.3.82" }
wasm-bindgen = { version = "=0.2.105" }
web-sys = { version = "0.3.82" }
