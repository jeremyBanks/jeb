[package]
name = "jeb-cdylib"
publish = true
repository = "https://github.com/jeremyBanks/jeb"
description = "jeb as a cdylib"
keywords = []
categories = []
version.workspace = true
license.workspace = true
edition.workspace = true
include.workspace = true

[lib]
name = "jeb"
crate-type = ["cdylib"]

[features]
default = ["wasm", "stdio", "fs"]
wasm = []
stdio = ["jeb/stdio"]
fs = ["jeb/fs"]

[dependencies]
wasm-bindgen = { version = "*" }
jeb = { path = "../jeb", default-features = false }
