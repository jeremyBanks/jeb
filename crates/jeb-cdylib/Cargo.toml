[package]
name = "jeb-cdylib"
publish = true
repository = "https://github.com/jeremyBanks/jeb"
description = "jeb as a cdylib"
keywords = []
categories = []
version.workspace = true
license.workspace = true
edition.workspace = true
include.workspace = true

[lib]
name = "jeb"
crate-type = ["cdylib"]
doc = false

[features]
default = ["wasm", "stdio", "fs"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "jeb/wasm"]
stdio = ["jeb/stdio"]
fs = ["jeb/fs"]

[dependencies]
wasm-bindgen = { version = "*", optional = true }
jeb = { path = "../jeb", default-features = false }
js-sys = { version = "0.3.82", optional = true }
web-sys = { version = "0.3.82", optional = true }
