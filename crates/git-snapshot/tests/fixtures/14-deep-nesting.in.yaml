HEAD: refs/heads/main

refs:
  heads:
    main: 4

# Test deeply nested directory structures
1:
  tree:
    a:
      b:
        c:
          d:
            e:
              f:
                deep.txt: "very deep file"

2:
  tree:
    # Move deep file to different deep location using relative paths
    x:
      y:
        z:
          moved-deep.txt:
            [commit]: 1
            [path]: a/b/c/d/e/f/deep.txt

3:
  tree:
    # Copy to even deeper location
    a:
      b:
        c:
          d:
            e:
              f:
                g:
                  h:
                    i:
                      very-deep.txt:
                        [commit]: 2
                        [path]: x/y/z/moved-deep.txt

4:
  tree:
    # Flatten everything to root
    flat-1.txt:
      [commit]: 1
      [path]: a/b/c/d/e/f/deep.txt
    flat-2.txt:
      [commit]: 2
      [path]: x/y/z/moved-deep.txt
    flat-3.txt:
      [commit]: 3
      [path]: a/b/c/d/e/f/g/h/i/very-deep.txt
