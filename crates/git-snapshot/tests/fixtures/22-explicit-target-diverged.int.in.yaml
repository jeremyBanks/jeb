HEAD: refs/heads/main

refs:
  heads:
    main: 6

# Test explicit zoom target that has diverged from implicit target
1:
  tree:
    file.txt: "v1"
    subtree:
      a.txt: "a1"
      b.txt: "b1"

2:
  parents: [1]
  tree:
    file.txt: "v2"
    subtree:
      a.txt: "a2"
      b.txt: "b2"

3:
  parents: [2]
  tree:
    file.txt: "v3"
    subtree:
      a.txt: "a3"
      b.txt: "b3"

4:
  parents: []
  tree: {}

# Zoom-in from commit 1's subtree (not latest commit 3)
5:
  parents: [4, 1]
  message: |
    Zoom in from historical state

    git-zoom-in: subtree
  tree:
    a.txt: "a1"
    b.txt: "b1"

# Zoom-out back to commit 1 (explicit target that diverged)
6:
  parents: [1, 5]
  message: |
    Zoom out to commit 1

    git-zoom-out: subtree
  tree:
    file.txt: "v1"
    subtree:
      a.txt:
        [commit]: 5
        [path]: a.txt
      b.txt:
        [commit]: 5
        [path]: b.txt
