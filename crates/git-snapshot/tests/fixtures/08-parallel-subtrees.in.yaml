HEAD: refs/heads/full-tree

refs:
  heads:
    full-tree: 7
    frontend-subtree: 3
    backend-subtree: 6

# Initial full-tree commit
1:
  tree:
    README.md: "# Full Stack App"
    frontend:
      app.js: "console.log('app');"
      style.css: "body { }"
    backend:
      server.py: "def serve(): pass"
      db.py: "def connect(): pass"

# Zoom into frontend
2:
  parents: []
  tree:  # empty seed for frontend
  message: "git-zoom-in seed for frontend"
  committer: "git-zoom-in <git-zoom-in@localhost>"

3:
  parents: [2, 1]
  message: |-
    Merge from 'frontend'

    git-zoom-in: frontend
  committer: "git-zoom-in <git-zoom-in@localhost>"
  tree:
    app.js:
      [commit]: 1
      [path]: frontend/app.js
    style.css:
      [commit]: 1
      [path]: frontend/style.css
    # Work in frontend subtree
    utils.js: "export const util = () => {};"

# Zoom out frontend
4:
  parents: [1, 3]
  message: |-
    Merge to 'frontend'

    git-zoom-out: frontend
  committer: "git-zoom-out <git-zoom-out@localhost>"
  tree:
    frontend:
      [commit]: 3
      [path]: .
    # backend inherited

# Zoom into backend (from F4, which has frontend changes)
5:
  parents: []
  tree:  # empty seed for backend
  message: "git-zoom-in seed for backend"
  committer: "git-zoom-in <git-zoom-in@localhost>"

6:
  parents: [5, 4]
  message: |-
    Merge from 'backend'

    git-zoom-in: backend
  committer: "git-zoom-in <git-zoom-in@localhost>"
  tree:
    server.py:
      [commit]: 4
      [path]: backend/server.py
    db.py:
      [commit]: 4
      [path]: backend/db.py
    # Work in backend subtree
    routes.py: "def routes(): pass"

# Zoom out backend
7:
  parents: [4, 6]
  message: |-
    Merge to 'backend'

    git-zoom-out: backend
  committer: "git-zoom-out <git-zoom-out@localhost>"
  tree:
    # Final tree with both subtree changes
    frontend:
      [commit]: 3
      [path]: .
    backend:
      [commit]: 6
      [path]: .
