# Test multiple branches with complex ref structure
HEAD: refs/heads/main

refs:
  heads:
    feature-a: 3
    feature-b: 4
    main: 5
    zzz-last: 2

1:
  tree:
    file.txt: "initial"

2:
  tree:
    file.txt: "branch zzz-last"

3:
  tree:
    file.txt: "feature a"
    feature-a.txt: "a specific"

4:
  tree:
    file.txt: "feature b"
    feature-b.txt: "b specific"

5:
  parents: [1, 3, 4]
  tree:
    file.txt: "merged"
    feature-a.txt:
      [commit]: 3
      [path]: feature-a.txt
    feature-b.txt:
      [commit]: 4
      [path]: feature-b.txt
