# Test tree inheritance prioritizing second parent path
HEAD: refs/heads/main

refs:
  heads:
    main: 5

# First parent line
1:
  tree:
    shared:
      file.txt: "from first parent"

# Second parent line with different content at same path
2:
  parents: []
  tree:
    shared:
      file.txt: "from second parent - different"

# Another commit on first parent
3:
  parents: [1]
  tree:
    shared:
      file.txt: "updated on first"
    main.txt: "main only"

# Another commit on second parent
4:
  parents: [2]
  tree:
    shared:
      file.txt: "updated on second"
    other.txt: "other only"

# Merge - should have options for inheritance from both parents
5:
  parents: [3, 4]
  tree:
    shared:
      file.txt: "merged content"
    main.txt:
      [commit]: 3
      [path]: main.txt
    other.txt:
      [commit]: 4
      [path]: other.txt
