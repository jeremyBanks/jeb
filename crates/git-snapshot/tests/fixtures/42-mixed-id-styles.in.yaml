# Test mixing integer and hex commit IDs in same file
HEAD: refs/heads/main

refs:
  heads:
    main: 3

# Integer ID
1:
  tree:
    file.txt: "integer id"

# Hex ID
0000000000000000000000000000000000000002:
  tree:
    file.txt: "hex id"

# Integer ID
3:
  parents: [1, 0000000000000000000000000000000000000002]
  tree:
    file.txt: "merge"
