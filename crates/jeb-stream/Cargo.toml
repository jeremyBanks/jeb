[package]
name = "jeb-stream"
publish = false
description = "(part of https://crates.io/crates/jeb)"
keywords = []
categories = []
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
jeb-common.workspace = true
jeb-value.workspace = true
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
async-stream.workspace = true
base64 = { workspace = true, optional = true }
cfg-if.workspace = true
derive_more = { workspace = true, features = ["full"] }
document-features.workspace = true
futures.workspace = true
macro_rules_attribute.workspace = true
parking_lot.workspace = true
static_assertions.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-util"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["codec", "io"] }

[features]
default = []
base64 = ["dep:base64"]
fs = ["tokio/fs"]
json = ["dep:serde_json", "jeb-value/serde_json"]
serde = ["dep:serde", "jeb-value/serde"]
stdio = ["tokio/io-std"]
wasm = ["jeb-common/wasm", "jeb-value/wasm", "dep:wasm-bindgen"]
wasm_bindgen = ["dep:wasm-bindgen"]
