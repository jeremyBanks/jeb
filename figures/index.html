<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Fira Code">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Acme">

<body class="working">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
    }

    canvas {
      display: block;
      /* max-width: calc(100% - 16px); */
      margin: 8px;
      cursor: pointer;
    }

    body.working {
      cursor: wait;
    }

    body:not(.working) canvas:hover {
      max-width: none;
    }
  </style>

  <script src="./p5.js"></script>
  <script type="module">
    const users = new Map();
    const games = new Map();


    const digits =
      "-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz";

    const size = 1024;

    const minPopulation = 16;

    document.addEventListener('click', event => {
      if (event.target.tagName === 'CANVAS') {
        const el = document.createElement('a');
        document.body.appendChild(el);
        el.href = event.target.toDataURL();
        el.download = "street.png";
        el.click();
        document.body.removeChild(el);
      }
    }, {
      capture: true
    });

    const doEvents = () => new Promise(r => requestIdleCallback(r));

    window.setup = async () => {
      pixelDensity(1.0);
      createCanvas(2500 - 65 + 24 * 64, 2400 - 141 + 24 * 64);
      document.querySelector('canvas').removeAttribute('style');
      translate(-22, -46);

      const response = await fetch('/-/records.json');
      const records = new Set(Object.values(await response.json()));

      games.set('all', {
        type: 'game',
        appId: 'all',
        name: `Stadians`,
        color: { r: 0xFF, g: 0xCC, b: 0xCC },
        users: new Set(),
        releaseDateA: 0,
        releaseDateB: 0,
        releaseDate: '',
      })

      games.set('founders', {
        type: 'game',
        appId: 'founders',
        name: 'Founders',
        color: { r: 0xFF, g: 0xFF, b: 0xCC },
        users: new Set(),
        releaseDateA: 2,
        releaseDateB: 2,
        releaseDate: '',
      })


      games.set('non-founders', {
        type: 'game',
        appId: 'non-founders',
        name: 'Settlers',
        color: { r: 0xCC, g: 0xCC, b: 0xFF },
        users: new Set(),
        releaseDateA: 3, //1574175600000 + 6 * 1000 * 60 * 60 * 24,
        releaseDateB: 3, //1574175600000 + 6 * 1000 * 60 * 60 * 24,
        releaseDate: '',
      });

      for (const record of records) {
        if (record.type === 'game' || record.type === 'avatar') {
          record.users = new Set();
          games.set(record.appId || record.avatarId, record);
          record.name = record.name
            .replace(/™/g, " ")
            .replace(/®/g, " ")
            .replace(/[\:\-]? Early Access$/g, " ")
            .replace(/[\:\-]? \w+ Edition$/g, " ")
            .replace(/- The Official Videogame/g, " ")
            .replace(/\(\w+ Ver(\.|sion)\)$/g, " ")
            .replace(/™/g, " ")
            .replace(/:(\w)/g, ": $1")
            .replace(/\s{2,}/g, " ")
            .replace(/^\s+|\s+$/g, "").slice(0);
          const launch = 1574175600000;

          if (record.type === 'avatar') {
            record.releaseDateA = 10;
            record.releaseDateB = 10;
            record.releaseDate = `avatar ${record.avatarId}`;
          }

          if (record.releaseDate === undefined) {
            record.releaseDateA = record.releaseDateB = (Math.floor(Math.max(launch, record.releaseDateA || 0, record.releaseDateB || 0) / (60 * 60 * 24 * 1000)) + 0.5) * 60 * 60 * 24 * 1000;
            const d = new Date(record.releaseDateA || 0);
            record.releaseDate = `${d.toLocaleString('en-ca', { month: 'short' }).toLowerCase().slice(0, 3)} ${(d.getDate()).toString().padStart(2)} '${d.getFullYear() % 100}`;
          }

          if (record.coverUrl) {
            record.coverImage = await new Promise(resolve => loadImage(record.coverUrl, resolve));
            if (record.type === 'game') {
              record.coverImage.resize(0, 128);
              record.coverImage.filter(BLUR, 12);
            } else {
              record.coverImage.resize(0, 64);
              record.coverImage.filter(BLUR, 1);
              record.coverImageBlurred = await new Promise(resolve => loadImage(record.coverUrl, resolve));
              record.coverImageBlurred.resize(0, 128);
              record.coverImageBlurred.filter(BLUR, 12);
            }
            const pixel = createImage(1, 1);
            record.coverImage.copy(pixel, 0, 0, record.coverImage.width, record.coverImage.height, 0, 0, 1, 1)
            pixel.loadPixels();
            record.color = {
              r: pixel.pixels[0] * (1 - 7 / 8) + 255 * 7 / 8,
              g: pixel.pixels[1] * (1 - 7 / 8) + 255 * 7 / 8,
              b: pixel.pixels[2] * (1 - 7 / 8) + 255 * 7 / 8,
            };
          } else {
            record.color = { r: 0, g: 0, b: 0 };
          }
        }
      }

      for (const record of records) {
        if (record.type === 'user' && record.playedAppIds) {
          if (record.number === "0000") {
            games.get('founders').users.add(record);
          } else {
            games.get('non-founders').users.add(record);
          }
          games.get('all').users.add(record);

          if (record.coverUrl) {
            const avatarId = record.coverUrl.split('avatar_')[1].split('.')[0];
            record.playedAppIds.push(avatarId);
          }

          users.set(record.userId, new Set(record.playedAppIds.map(appId => {
            // merge Nazi-free variant of Wolfenstein with main version
            if (appId === '6d92431b6ca24d69a771cf136a2a231frcp1') {
              appId = '4884bd9bd7864cf28deef05ef4b69e70rcp1';
            }
            const game = games.get(appId);
            game.users = game.users || new Set();
            game.users.add(record);
            return game;
          })));
        }
      }

      games.delete('6d92431b6ca24d69a771cf136a2a231frcp1');

      const population = users.size;
      const founderPopulation = [...records.values()].filter(user => user.playedAppIds && user.number === '0000').length;

      games.get('all').releaseDate = `n = ${population}`;
      games.get('founders').releaseDate = `n = ${founderPopulation}`;
      games.get('non-founders').releaseDate = `n = ${population - founderPopulation}`;

      const orderedGames = [...games.values()]
        .sort((a, b) => b.users.size - a.users.size)
        .sort((a, b) => Math.max(a.releaseDateA, a.releaseDateB) - Math.max(b.releaseDateA, b.releaseDateB))

      strokeJoin(ROUND);

      let brightness = 0;

      for (const layer of ['grid', 'grod', 'squares', 'real-grid']) {
        for (const [i, game] of Object.entries(orderedGames)) {
          await doEvents();

          let x = 23;
          let y = 72 + i * 24;

          let { r, g, b } = game.color;

          stroke(r / 4, g / 4, b / 4, 256);
          strokeWeight(2);

          fill(0, 0, 0);
          strokeWeight(2);
          stroke(r, g, b, 128);
          textSize(16);
          textFont('JetBrains Mono');
          textStyle(NORMAL);
          stroke(r, g, b, 256);
          textSize(18);
          textFont('Acme');

          if (layer === 'grod') {

            if (game.type !== 'avatar') {
              text(game.name,
                x + 4, y + 18);
            } else {
              text(game.name,
                x + 4 + 24, y + 18);

            }
            textSize(14);

            // textSize(22);
            // text(prefix,
            //   y + 156, x + 27, 24);

            textAlign(CENTER);
            textSize(14);
            strokeWeight(4);
            stroke(r, g, b, 192);
            if (game.type === 'game') {
              text(game.name.slice(0, 1),
                y + 154, x + 30, 24);
            }

            if (game.releaseDate) {
              fill(0, 0, 0, 192);
              strokeWeight(0);
              rect(x + 135, y, 200 - 133, 24);
              textAlign(CENTER);
              textFont("Trebuchet MS");
              textSize(12);
              textStyle(BOLD);
              strokeWeight(0);
              stroke(0);
              fill(r, g, b, 225);
              text(game.releaseDate, x + 168, y + 16);
              strokeWeight(2);
              line(x + 135, y, x + 135, y + 24);
            }
            textAlign(LEFT);
          }

          if (layer === 'grid') {
            if (game.coverImage) {
              if (game.type === 'game') {
                image(game.coverImage, x, y, 200, 24);
              } else {
                image(game.coverImageBlurred, x, y, 200, 24);
                image(game.coverImage, x, y, 24, 24);
              }
              image(game.coverImage, y + 152, x + 24, 24, 24);
            } else {
              strokeWeight(0);
              fill(r, g, b);
              rect(x, y, 200, 24);
              rect(y + 152, x + 24, 24, 24);
            }

          }

          if (layer === 'real-grid') {
            stroke(0, 0, 0);
            strokeWeight(2);
            fill(0, 0, 0, 0);
            rect(-32, y, size * 4, 24);
            rect(y + 152, -32, 24, size * 4);
          }

          if (layer === "squares") {
            for (const [j, otherGame] of Object.entries(orderedGames)) {
              if (j % 32 === 0) {
                await doEvents();
              }

              let oX = j * 24 + 72;
              let oY = y + 152 - 72;

              {
                let t = oX;
                oX = oY;
                oY = t;
              }


              strokeWeight(0);
              fill(0, 0, 0);
              rect(72 + oX, oY, 24, 24);

              if (game.coverImage || otherGame.coverImage) {
                game.coverImage && blend(game.coverImage, 0, 0, game.coverImage.width, game.coverImage.height, 72 + oX, oY, 24, 24, SCREEN);
                otherGame.coverImage && blend(otherGame.coverImage, 0, 0, otherGame.coverImage.width, otherGame.coverImage.height, 72 + oX, oY, 24, 24, SCREEN);

                fill((r + otherGame.color.r) / 2,
                  (g + otherGame.color.g) / 2,
                  (b + otherGame.color.b) / 2,
                  255 * (1 / 2));
              } else {
                fill((r + otherGame.color.r) / 2,
                  (g + otherGame.color.g) / 2,
                  (b + otherGame.color.b) / 2,
                  255);
              }
              rect(72 + oX, oY, 24, 24);


              let unknown = false;
              let overlap = [...game.users].filter(u => otherGame.users.has(u)).length / game.users.size;
              if ((otherGame.users.size < minPopulation || game.users.size < minPopulation) && game !== otherGame) {
                if (game.users.size < minPopulation || (otherGame.users.size < minPopulation && game.users.size < minPopulation * 8)) {
                  unknown = true;
                  overlap = NaN;
                }
              }
              if (otherGame.appId === "all" || otherGame === game) {
                unknown = false;
                overlap = 1.0;
              }
              strokeWeight(0);


              fill(0, 0, 0, !isNaN(overlap) ? ((1 - overlap) * 255) : 255);
              rect(72 + oX, oY, 24, 24);

              fill(0, 0, 0);
              strokeWeight(2);
              stroke(255, 255, 255, 192 + (overlap || 0) * (255 - 192));
              textFont('JetBrains Mono');
              textStyle(BOLD);

              if (overlap === 1.0) {
                if (game !== otherGame || true) {
                  textSize(10);
                  text((100 * overlap).toFixed(0).padStart(2) + '', 71 + oX + 4, oY + 15.5);
                }
              } else if (unknown) {
                fill(16, 16, 16, 256);
                // stroke(255, 255, 255, 64);
                textSize(12);
                text(' ?', 72 + oX + 4, oY + 16);
              } else {
                textSize(12);
                text((100 * overlap).toFixed(0).padStart(2) + '', 72 + oX + 4, oY + 16);
              }
            }
          }
        }
      }

      strokeWeight(2);
      stroke(0, 0, 0, 255);
      line(23, 47 + 24 + 2, 23, 4000);
      line(23 + 200 + 2, 47, 4000, 47);
      document.body.classList.remove('working');
    }
  </script>
