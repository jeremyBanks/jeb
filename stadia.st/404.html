<!doctype html><meta charset="utf-8">

<script type="module">
  (async() => {
    const pieces = document.location.toString().split(/\//g);
    if (pieces[pieces.length - 2] === 'add') {
      const tail = pieces[pieces.length - 1];

      if (tail.match(/^[A-Za-z0-9]([#\-][0-9]{4})+$/)) {
        let [targetName, targetNumber] = tail.split(/[\-#]/);
        targetName = targetName.toLowerCase();
        targetNumber = Number(targetNumber || 0);

        const data = await (await fetch('/-/skus.json')).json();

        for (const {item, userId, name, number} of Object.values(data)) {
          if (
            type === "user" &&
            name.toLowerCase() === targetName &&
            targetNumber == Number(number)
          ) {
            document.location = `https://stadia.google.com/home?si_rid=${userId}`;
            break;
          }
        }
      }
    }

    document.location.hostname = 'stadia.run';
  })();
</script>
