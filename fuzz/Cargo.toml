[package]
name = "jeb-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
bincode = "1"
libfuzzer-sys = "0.4"
protobuf-wire = { path = "../crates/protobuf-wire", features = ["arbitrary"] }
serde = { version = "1", features = ["derive"] }
serde-value = { path = "../crates/serde-value", features = ["arbitrary"] }
serde_json = "1"

[[bin]]
name = "protobuf_parse"
path = "fuzz_targets/protobuf_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protobuf_roundtrip"
path = "fuzz_targets/protobuf_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde_value_bincode_roundtrip"
path = "fuzz_targets/serde_value_bincode_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde_value_roundtrip"
path = "fuzz_targets/serde_value_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde_value_coercions"
path = "fuzz_targets/serde_value_coercions.rs"
test = false
doc = false
bench = false
