# XXX: temporarily disabled (see profile.release.trim-paths below)
# cargo-features = ["trim-paths"]

[workspace]
resolver = "2"
members = [
    "crates/_autofix",
    "crates/_chosen",
    "crates/_ci",
    "crates/_claude_hooks",
    "crates/_examples",
    "crates/_examples/fuzz",
    "crates/_scripts",
    "crates/_trace",
    "crates/git-snapshot",
    "crates/git-zoom",
    "crates/inline",
    "crates/jeb",
    "crates/jeb-common",
    "crates/jeb-common/fuzz",
    "crates/jeb-stream",
    "crates/jeb-tracing",
    "crates/jeb-value",
    "crates/jeb-wasm",
    "crates/save",
    "crates/stringify_verbatim",
    "crates/gravity",
    "crates/z855",
    "crates/zerodmg",
    "crates/zerodmg-codes",
    "crates/zerodmg-emulator",
    "crates/zerodmg-utils",
    "crates/zipng",
    "crates/zipng-wasm",
]

[workspace.package]
version = "0.0.0-dev-2026-01-25.7901"
authors = ["Jeremy Banks"]
repository = "https://github.com/jeremyBanks/jeb"
description = "(part of https://crates.io/crates/jeb)"
publish = false
keywords = []
categories = []
edition = "2024"
license = "MIT OR Apache-2.0"
include = ["**/*.rs", "**/*.toml", "**/*.lock", "**/*.md", "**/LICENSE*", "!.*"]

[profile.release]
# XXX: temporarily disabled due to compatibility issue with cargo-fuzz
# (nightly doesn't recognize -Zremap-path-scope), to be re-enabled later
# trim-paths = "all"

[profile.dev.package.backtrace]
opt-level = 3

[profile.small]
inherits = "release"
lto = true
opt-level = "z"
codegen-units = 1
strip = true
split-debuginfo = "packed"
panic = "abort"

[patch]

[patch.crates-io]
_autofix = { path = "crates/_autofix" }
_chosen = { path = "crates/_chosen" }
_ci = { path = "crates/_ci" }
_claude_hooks = { path = "crates/_claude_hooks" }
_examples = { path = "crates/_examples" }
_examples-fuzz = { path = "crates/_examples/fuzz" }
_scripts = { path = "crates/_scripts" }
_trace = { path = "crates/_trace" }
git-snapshot = { path = "crates/git-snapshot" }
git-zoom = { path = "crates/git-zoom" }
inline = { path = "crates/inline" }
jeb = { path = "crates/jeb" }
jeb-common = { path = "crates/jeb-common" }
jeb-common-fuzz = { path = "crates/jeb-common/fuzz" }
jeb-stream = { path = "crates/jeb-stream" }
jeb-tracing = { path = "crates/jeb-tracing" }
jeb-value = { path = "crates/jeb-value" }
jeb-wasm = { path = "crates/jeb-wasm" }
save = { path = "crates/save" }
stringify_verbatim = { path = "crates/stringify_verbatim" }
zerodmg = { path = "crates/zerodmg" }
zerodmg-codes = { path = "crates/zerodmg-codes" }
zerodmg-emulator = { path = "crates/zerodmg-emulator" }
zerodmg-utils = { path = "crates/zerodmg-utils" }
z855 = { path = "crates/z855" }
zipng = { path = "crates/zipng" }
zipng-wasm = { path = "crates/zipng-wasm" }

