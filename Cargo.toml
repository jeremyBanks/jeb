[package]
name = "jeb"
version = "0.1.0"
edition = "2021"

[lib]
name = "jeb"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "jeb"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "mysql"] }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = "z"
lto = true
