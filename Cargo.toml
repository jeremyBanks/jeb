[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0-dev-2025-12-26.6614"
repository = "https://github.com/jeremyBanks/jeb"
edition = "2024"
license = "MIT OR Apache-2.0"
include = ["**/*.rs", "**/*.toml", "**/*.lock", "**/*.md", "**/LICENSE*", "!.*"]

[profile.small]
inherits = "release"
lto = true
opt-level = "z"
codegen-units = 1
strip = true
split-debuginfo = "packed"
panic = "abort"

[workspace.dependencies]
jeb = { path = "crates/jeb", version = "0.0.0-dev-2025-12-26.6614" }
jeb-common = { path = "crates/jeb-common", version = "0.0.0-dev-2025-12-26.6614" }
jeb-values = { path = "crates/jeb-values", version = "0.0.0-dev-2025-12-26.6614" }
jeb-node = { path = "crates/jeb-node", version = "0.0.0-dev-2025-12-26.6614" }

wasm-bindgen = "0.2.105"
web-sys = "0.3.82"
