# XXX: temporarily disabled (see profile.release.trim-paths below)
# cargo-features = ["trim-paths"]

[workspace]
resolver = "2"
members = ["crates/*", "crates/*/fuzz"]
exclude = ["crates/speedrun"]

[workspace.package]
version = "0.0.0-dev-2026-01-25.7901"
authors = ["Jeremy Banks"]
repository = "https://github.com/jeremyBanks/jeb"
description = "(part of https://crates.io/crates/jeb)"
publish = false
keywords = []
categories = []
edition = "2024"
license = "MIT OR Apache-2.0"
include = ["**/*.rs", "**/*.toml", "**/*.lock", "**/*.md", "**/LICENSE*", "!.*"]

[profile.release]
# XXX: temporarily disabled due to compatibility issue with cargo-fuzz
# (nightly doesn't recognize -Zremap-path-scope), to be re-enabled later
# trim-paths = "all"

[profile.dev.package.backtrace]
opt-level = 3

[profile.small]
inherits = "release"
lto = true
opt-level = "z"
codegen-units = 1
strip = true
split-debuginfo = "packed"
panic = "abort"

[patch]

[patch.crates-io]
_autofix = { path = "crates/_autofix" }
_chosen = { path = "crates/_chosen" }
_claude_hooks = { path = "crates/_claude_hooks" }
_examples = { path = "crates/_examples" }
_scripts = { path = "crates/_scripts" }
_trace = { path = "crates/_trace" }
git-snapshot = { path = "crates/git-snapshot" }
git-zoom = { path = "crates/git-zoom" }
ideated-encoding = { path = "crates/ideated-encoding" }
inline = { path = "crates/inline" }
jeb = { path = "crates/jeb" }
jeb-bytes-as-text = { path = "crates/jeb-bytes-as-text" }
jeb-common = { path = "crates/jeb-common" }
jeb-tracing = { path = "crates/jeb-tracing" }
jeb-stream = { path = "crates/jeb-stream" }
jeb-value = { path = "crates/jeb-value" }
jeb-wasm = { path = "crates/jeb-wasm" }
save = { path = "crates/save" }
stringify_verbatim = { path = "crates/stringify_verbatim" }

[workspace.dependencies]
_autofix = { path = "crates/_autofix" }
_chosen = { path = "crates/_chosen" }
