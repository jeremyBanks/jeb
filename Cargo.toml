[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0-vibes-2025-11-27.7832"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
include = ["**/*.rs", "**/*.toml", "**/*.lock", "**/*.md", "**/LICENSE*", "!.*"]

[profile.small]
inherits = "release"
lto = true
opt-level = "z"
codegen-units = 1
strip = true
split-debuginfo = "packed"
panic = "abort"

[workspace.dependencies]
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-stream = "0.1"
