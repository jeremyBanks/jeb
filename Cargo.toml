[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0-dev-2025-12-26.7705"
repository = "https://github.com/jeremyBanks/jeb"
description = "(internal to https://crates.io/crates/jeb)"
publish = false
keywords = []
categories = []
edition = "2024"
license = "MIT OR Apache-2.0"
include = ["**/*.rs", "**/*.toml", "**/*.lock", "**/*.md", "**/LICENSE*", "!.*"]

[profile.dev.package.backtrace]
opt-level = 3

[profile.small]
inherits = "release"
lto = true
opt-level = "z"
codegen-units = 1
strip = true
split-debuginfo = "packed"
panic = "abort"

[patch]

[patch.crates-io]
_autofix = { path = "crates/_autofix" }
_claude_hooks = { path = "crates/_claude_hooks" }
_scripts = { path = "crates/_scripts" }
git-snapshot = { path = "crates/git-snapshot" }
git-zoom = { path = "crates/git-zoom" }
jeb = { path = "crates/jeb" }
jeb-bytes-as-text = { path = "crates/jeb-bytes-as-text" }
jeb-common = { path = "crates/jeb-common" }
jeb-stream = { path = "crates/jeb-stream" }
jeb-value = { path = "crates/jeb-value" }
jeb-wasm = { path = "crates/jeb-wasm" }
save = { path = "crates/save" }

[workspace.dependencies]
jeb = { path = "crates/jeb", default-features = false, version = "0.0.0-dev-2025-12-26.7705" }
jeb-stream = { path = "crates/jeb-stream", version = "0.0.0-dev-2025-12-26.7705" }
anyhow = {}
async-stream = {}
bstr = {}
cfg-if = {}
digest = {}
dissimilar = {}
document-features = {}
expect-test = {}
eyre = {}
fast_hilbert = {}
futures = {}
getset = {}
git-snapshot = { version = "0.0.0-dev-2025-12-26.7705" }
git2 = {}
glob = {}
home = {}
ignorable = {}
