[package]
name = "stadians"
publish = false
version = "0.0.0"
edition = "2021"

[dependencies]
bincode = "1.3.3"
blake3 = "1.1.0"
bounded-integer = { version = "0.5.0", features = ["types", "serde"] }
color-eyre = "0.5.11"
derive_more = "0.99.16"
erased-serde = "0.3.16"
eyre = "0.6.5"
getset = "0.1.1"
log = "0.4.14"
paste = "1.0.6"
prost = "0.9.0"
rand = "0.8.4"
regex = "1.5.4"
remain = "0.2.2"
reqwest = { version = "0.11.6", features = ["json"] }
rusqlite = { version = "0.26.1", features = ["bundled-full", "session", "buildtime_bindgen"] }
serde = { version = "1.0.126", features = ["derive"] }
serde-transcode = "1.1.1"
serde_json = "1.0.68"
serde_repr = "0.1.7"
serde_rusqlite = "0.28.0"
serde_urlencoded = "0.7.0"
sled = { version = "0.34.7", features = ["compression"] }
thiserror = "1.0.30"
time = "0.3.4"
tokio = { version = "1.12.0", features = ["full"] }
tracing = { version = "0.1.29", features = ["log"] }
tracing-error = { version="0.1.2", features = ["traced-error"] }
tracing-futures = "0.2.5"
tracing-log = "0.1.2"
tracing-serde = "0.1.2"
tracing-subscriber = "0.2.5"
tracing-unwrap = "0.9.2"
typetag = "0.1.7"
url = { version = "2.2.2", features = ["serde"] }

[profile.dev.package.backtrace]
opt-level = 3
