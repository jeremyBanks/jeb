[package]
name = "jeb"
version = "0.0.8"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "jeb"
path = "src/lib.rs"

[[bin]]
name = "jeb"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.0", features = ["fs", "io-util", "io-std", "rt-multi-thread", "macros"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
duckdb = "1.1"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = "z"
lto = true
