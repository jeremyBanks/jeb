[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0-dev-2025-12-26.7705"
repository = "https://github.com/jeremyBanks/jeb"
description = "(part of https://crates.io/crates/jeb)"
keywords = []
categories = []
edition = "2024"
license = "MIT OR Apache-2.0"
include = ["**/*.rs", "**/*.toml", "**/*.lock", "**/*.md", "**/LICENSE*", "!.*"]

[profile.small]
inherits = "release"
lto = true
opt-level = "z"
codegen-units = 1
strip = true
split-debuginfo = "packed"
panic = "abort"

[workspace.dependencies]
jeb = { path = "crates/jeb", version = "0.0.0-dev-2025-12-26.7705" }
jeb-common = { path = "crates/jeb-common", version = "0.0.0-dev-2025-12-26.7705" }
jeb-streaming = { path = "crates/jeb-streaming", version = "0.0.0-dev-2025-12-26.7705" }
jeb-value = { path = "crates/jeb-value", version = "0.0.0-dev-2025-12-26.7705" }

async-stream = "0.3.6"
cfg-if = "1.0.4"
color-eyre = "0.6.5"
derive_more = "2.0.1"
document-features = "0.2.12"
dotenv = "0.15.0"
futures = "0.3"
getset = "0.1.6"
ignorable = "0.1.2"
indexmap = "2.0"
js-sys = "=0.3.82"
macro_rules_attribute = "0.2.2"
owo-colors = "4.2.3"
regex = "1.12.2"
serde = "1.0"
serde_bytes = "0.11"
serde_json = "1.0"
static_assertions = "1.1.0"
tap = "1.0.1"
tokio = "1.0"
tokio-stream = "0.1"
tokio-util = "0.7.17"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
wasm-bindgen = "=0.2.105"
web-sys = "=0.3.82"
