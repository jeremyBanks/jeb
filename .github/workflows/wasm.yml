name: WASM Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wasm:
    name: Build WASM Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-wasm-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WASM (wasm-pack for web)
        run: wasm-pack build --target web --release

      - name: Build WASM (wasm-pack for nodejs)
        run: wasm-pack build --target nodejs --release --out-dir pkg-node

      - name: Build WASM (wasm-pack for bundler)
        run: wasm-pack build --target bundler --release --out-dir pkg-bundler

      - name: Build WASM (cargo for wasm32-unknown-unknown)
        run: cargo build --lib --target wasm32-unknown-unknown --release

      - name: Upload WASM artifacts (web)
        uses: actions/upload-artifact@v3
        with:
          name: wasm-web
          path: pkg/

      - name: Upload WASM artifacts (nodejs)
        uses: actions/upload-artifact@v3
        with:
          name: wasm-nodejs
          path: pkg-node/

      - name: Upload WASM artifacts (bundler)
        uses: actions/upload-artifact@v3
        with:
          name: wasm-bundler
          path: pkg-bundler/

      - name: Upload raw WASM binary
        uses: actions/upload-artifact@v3
        with:
          name: wasm-binary
          path: target/wasm32-unknown-unknown/release/*.wasm

  test-wasm:
    name: Test WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Test with wasm-pack
        run: wasm-pack test --headless --firefox --chrome
