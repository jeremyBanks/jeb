name: Tests and Native Build
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - trunk

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo publish --dry-run
