permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - trunk

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for version check and semver

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: "-A warnings"

      - name: Build and dry-run publish
        run: |
          cargo build
          cargo publish --dry-run

      - name: Check version
        run: ./scripts/check-version.sh

      - name: Find baseline tag for semver check
        id: baseline
        run: |
          # Find the most recent tag matching semver pattern (N.N.N*)
          # from commits reachable from HEAD (works for PRs and trunk)
          BASELINE=$(git tag --merged HEAD --sort=-creatordate | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
          if [ -n "$BASELINE" ]; then
            echo "tag=$BASELINE" >> $GITHUB_OUTPUT
            echo "Found baseline tag: $BASELINE"
          else
            echo "No baseline tag found, skipping semver check"
          fi

      - name: Check if version has changed
        id: version_check
        if: steps.baseline.outputs.tag != ''
        run: |
          # Extract version from Cargo.toml (workspace or single package)
          if grep -q '^\[workspace\.package\]' Cargo.toml; then
            CURRENT_VERSION=$(grep '^\[workspace\.package\]' -A 10 Cargo.toml | grep '^version = ' | head -1 | cut -d'"' -f2)
          else
            CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          fi

          BASELINE_TAG="${{ steps.baseline.outputs.tag }}"

          echo "Current version: $CURRENT_VERSION"
          echo "Baseline tag: $BASELINE_TAG"

          if [ "$CURRENT_VERSION" = "$BASELINE_TAG" ]; then
            echo "Version has not changed, skipping semver check"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Version has changed from $BASELINE_TAG to $CURRENT_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Check semver compatibility
        if: steps.baseline.outputs.tag != '' && steps.version_check.outputs.changed == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ steps.baseline.outputs.tag }}

  release:
    runs-on: ubuntu-latest
    needs: checks
    if: github.ref == 'refs/heads/trunk'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for tags

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: "-A warnings"

      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $VERSION already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $VERSION does not exist"
          fi

      - name: Attempt cargo publish
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "https://crates.io/crates/jeb/$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.get_version.outputs.version }}"
          name: "${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            https://crates.io/crates/jeb/${{ steps.get_version.outputs.version }}
