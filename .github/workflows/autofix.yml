on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  autofix:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: denoland/setup-deno@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: "-A warnings"
      - run: deno fmt
      - run: cargo fix --allow-dirty
      - run: cargo clippy --fix --allow-dirty
      - run: cargo fmt
      - run: deno task build-wasm
      - run: examples/all.sh

      - id: last-commit
        run: |
          message="$(git log -1 --pretty=%s)"

          if [[ "$message" == "autofix autofix autofix"* ]]; then
            echo "ERROR: Autofix has already run 3 times in a row, aborting to prevent infinite loop"
            exit 1
          fi

          echo "message<<AUTOFIX_EOF" >> "$GITHUB_OUTPUT"
          echo "$message" >> "$GITHUB_OUTPUT"
          echo "AUTOFIX_EOF" >> "$GITHUB_OUTPUT"

          echo "author=$(git log -1 --pretty="%an <%ae>")" >> "$GITHUB_OUTPUT"

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "autofix ${{ steps.last-commit.outputs.message }}"
          commit_author: ${{ steps.last-commit.outputs.author }}
