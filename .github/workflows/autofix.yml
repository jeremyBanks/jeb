on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  autofix:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_TOKEN }}
      - id: commit-info
        run: |
          MESSAGE=$(git log -1 --pretty=%s)
          AUTHOR=$(git log -1 --pretty="%an <%ae>")
          {
            echo "message<<EOF"
            echo "$MESSAGE"
            echo "EOF"
            echo "author<<EOF"
            echo "$AUTHOR"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          if [[ "$MESSAGE" == "autofix autofix autofix"* ]]; then
            echo "ERROR: Autofix has already run 3 times in a row, aborting to prevent infinite loop"
            exit 1
          fi
      - uses: denoland/setup-deno@v2
      - run: deno fmt
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fix --allow-dirty
      - run: cargo clippy --fix --allow-dirty
      - run: cargo fmt
      - run: crates/jeb/examples/all.sh
      - name: Commit and push changes
        env:
          PREV_MESSAGE: ${{ steps.commit-info.outputs.message }}
          PREV_AUTHOR: ${{ steps.commit-info.outputs.author }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "autofix ${PREV_MESSAGE}" --author="${PREV_AUTHOR}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${HEAD_REPO}.git" "HEAD:${HEAD_REF}"
