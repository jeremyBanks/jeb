on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check-commit:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
      author: ${{ steps.check.outputs.author }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - id: check
        run: |
          MESSAGE=$(git log -1 --pretty=%s)
          AUTHOR=$(git log -1 --pretty="%an <%ae>")
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          if [[ "$MESSAGE" == autofix* ]]; then
            echo "Previous commit was autofix, skipping"
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  autofix:
    runs-on: ubuntu-latest
    needs: check-commit
    if: needs.check-commit.outputs.should_skip != 'true'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: denoland/setup-deno@v2
      - run: deno fmt
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fix --allow-dirty
      - run: cargo clippy --fix --allow-dirty
      - run: cargo fmt
      - run: crates/jeb/examples/all.sh
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: autofix
          commit_author: ${{ needs.check-commit.outputs.author }}
