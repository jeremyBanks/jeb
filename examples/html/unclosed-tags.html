<html>
<head>
    <title>HTML with Unclosed Tags</title>
</head>
<body>
    <h1>Lenient HTML Parsing</h1>
    <p>This HTML has some unclosed tags.</p>
    <p>HTML parsers should handle this gracefully.</p>
    <ul>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ul>
    <img src="image.jpg" alt="An image"/>
    <br/>
    <hr/>
</body>
</html>
