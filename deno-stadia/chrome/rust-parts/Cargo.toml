[package]
name = "rust-parts"
version = "0.1.0"
authors = ["Jeremy Banks <_@jeremy.ca>"]
edition = "2018"

[lib]
name = "crypto"
crate-type = ["cdylib", "rlib"]
path = "./crypto.rs"

[[bin]]
name = "windows"
path = "./windows.rs"

[dependencies]
wasm-bindgen = "0.2.63"

console_error_panic_hook = "0.1.6"
wee_alloc = "0.4.5" 

[dev-dependencies]
wasm-bindgen-test = "0.3.13"

[profile.release]
opt-level = "s"
