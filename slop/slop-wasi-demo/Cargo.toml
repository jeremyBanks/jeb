[package]
name = "slop-wasi-demo"
version.workspace = true
publish = false
license.workspace = true
edition.workspace = true

[[bin]]
name = "slop-wasi-demo"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true

# Single-threaded tokio for async I/O
# WASI only supports: sync, macros, io-util, rt, time
tokio = { version = "1.0", default-features = false, features = [
    "io-util",
    "rt",
    "macros",
] }
