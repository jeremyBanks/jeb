[package]
name = "slop-lenient-json"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
description = "A lenient JSON parser with optional commas, comments, and unquoted keys"
repository = "https://github.com/jeremyBanks/json-entity-bucket"
readme = "SPEC.md"
keywords = ["json", "parser", "lenient", "config"]
categories = ["parser-implementations", "encoding"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

